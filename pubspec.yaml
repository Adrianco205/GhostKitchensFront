name: ghost_kitchens_app
description: "Ghost Kitchen mobile app — Flutter + Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # === Networking ===
  dio: ^5.7.0

  # === Secure storage para tokens ===
  flutter_secure_storage: ^9.2.2

  # === Manejo de estado opcional ===
  provider: ^6.1.2

  # === JSON serialization (opcional) ===
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Para DTOs si los usas
  json_serializable: ^6.8.0
  build_runner: ^2.4.8

  # Íconos de la app
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "lib/asset/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - lib/asset/images/
